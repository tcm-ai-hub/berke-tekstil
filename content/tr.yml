  facts_h: Denizli’de, 1995’ten beri.
  facts:
  - - '1995'
    - Denizli tekstilinde başlayan deneyim
  - - '2015'
    - Berke Tekstil
  - - '5'
    - Ürün grubu, tek üretim ortağı
  fibres_h: Lif ve doku
  fibres_p: Her ürün doğru kumaşla başlar. Koleksiyonunuz için kumaşı birlikte seçer, numuneyle onaylarız.
  fibres:
  - - Pamuk lifi
    - Yumuşak, nefes alan, cilt dostu.
    - fiber.jpg
  - - Müslin
    - Hafif, katmanlı, bebek tekstilinin vazgeçilmezi.
    - gauze.jpg
  - - Havlu
    - Emici ilmekler, nakışa hazır yüzey.
    - towel.jpg
  - - İplik
    - Kumaşın tutumu ipliğin inceliğinde saklıdır.
    - yarn.jpg
  proof_e: Atölye
  proof_h: İmzanız, iplikle.
  proof_p: Logo, monogram ve bordür kendi atölyemizde işlenir. Her parça onaylı numunenin standardında; kumaşı kalıba göre planlar, boşlukları değerlendiririz.
  feat_e: Private label
  feat_h: Fikirden kapınıza.
  feat:
  - Ar-Ge dosyanızdan ya da örnek ürününüzden numune
  - Kumaş, aksesuar ve renk seçimi birlikte
  - Nakış, baskı ve dokuma etiket
  - Markanıza özel etiket ve ambalaj
  - Her adımda fotoğraflı bilgilendirme
  - Anlaşmalı kargo ile sevkiyat
  coll_e: Koleksiyonlar
  coll_h: Beş ürün grubu.
  close_h: Sıra sizin tasarımınızda.
  close_p: Ar-Ge dosyanızı, çiziminizi ya da örnek ürününüzü gönderin; numunesini en kısa sürede çıkaralım. İstanbul’dan Almanya’ya, markalarla çalışıyoruz.
  close_cta: Projenizi konuşalım
scroll:
- 'Özenle yetişir.

  Sabırla toplanır.

  Ürettiğimiz her parça

  bir pamuk lifiyle başlar.'
- 'Lif taranır, inceltilir

  ve ipliğe dönüşür.

  Kumaşın tutumu

  ipliğin inceliğinde saklıdır.'
- 'İplik kumaşa dönüşür.

  Havlu, müslin, penye, kanvas;

  koleksiyonunuz için seçilir.'
- 'Kesilir, dikilir, işlenir.

  Logo ve monogram

  kendi atölyemizde.'
- 'Ve markanızın etiketiyle

  size ulaşır.

  Pamuktan markanıza.'
