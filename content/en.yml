heritage:
  eyebrow: About
  year_caption: "in Denizli's textile industry since"
  h: "Denizli's textile know-how, for today's brands."
  story:
    - "We built our experience with Denizli's leading textile companies from 1995 and brought it together under the Berke Tekstil name in 2015."
    - "Today we manufacture for brands from design to shipment, and grow our own home textile brand, Fronte Home. That is why we know what makes a product sell."
  timeline:
    - ["1995", The start, "Production experience with Denizli's leading textile companies."]
    - ["2015", Berke Tekstil, "Our experience under our own name; contract and private label manufacturing."]
    - [Today, Fronte Home, "Our own home textile brand, where we test fabrics and finishes on real customers."]
    - ["2027", "Heimtextil, Frankfurt", "We will be at the fair with our samples on 12–15 January 2027. Write to us to meet."]
  cta: Meet us at the fair
